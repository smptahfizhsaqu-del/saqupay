<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAQU PAY</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f6f4; margin: 0; color: #1d2b24; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; text-align: center; color: #1b5e3f; }
  .kartu { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
           box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: #4a5a52; }
  input, select { width: 100%; box-sizing: border-box; padding: 12px; font-size: 18px;
          border: 1px solid #b8c5bd; border-radius: 8px; background: #fff; }
  button { width: 100%; padding: 14px; font-size: 17px; border: 0; border-radius: 8px;
           background: #1b5e3f; color: #fff; margin-top: 12px; cursor: pointer; }
  button.abu { background: #7b8a82; }
  button:disabled { opacity: .5; }
  .pesan { padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
  .ok { background: #dff3e6; color: #145a32; }
  .err { background: #fde3e1; color: #8b1a10; }
  .besar { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SAQU PAY</h1>

  <!-- LOGIN -->
  <div id="login" class="kartu">
    <label>Username</label>
    <input id="user" autocomplete="off" autocapitalize="none" autocorrect="off">
    <label>Password</label>
    <input id="pass" type="password" autocomplete="off">
    <button id="btnMasuk" onclick="masukKlik()">Masuk</button>
    <div id="pesanLogin" class="pesan"></div>
  </div>

  <!-- BAR ATAS -->
  <div id="bar" class="kartu hide">
    <div id="info"></div>
    <button class="abu" onclick="keluarKlik()">Keluar</button>
  </div>

  <!-- KAMERA -->
  <div id="kamera" class="kartu hide">
    <div id="reader" style="width:100%"></div>
    <div id="pesanKamera" class="pesan"></div>
    <button class="abu" onclick="tutupKamera()">Tutup kamera</button>
  </div>

  <!-- KASIR BERSAMA: KERANJANG BEBERAPA PENJUAL -->
  <div id="keranjang" class="hide">
    <div id="kr1">
      <div class="kartu">
        <div class="besar">Pilih barang</div>
        <label>Penjual</label>
        <select id="krPenjual" onchange="krGantiPenjual()"></select>
        <div id="krMenu" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
        <label>Atau ketik barang di luar menu</label>
        <input id="krNamaManual" autocomplete="off" maxlength="50" placeholder="Nama barang">
        <input id="krHargaManual" inputmode="numeric" autocomplete="off" placeholder="Harga (Rp)" style="margin-top:6px">
        <button class="abu" onclick="krTambahManual()">Tambah ke keranjang</button>
      </div>
      <div class="kartu">
        <div class="besar">Keranjang</div>
        <div id="krIsi">Keranjang kosong</div>
        <div id="krTotal" class="besar" style="margin-top:8px"></div>
        <button class="abu" onclick="krKosongkan()">Kosongkan keranjang</button>
      </div>
      <div class="kartu">
        <label>Kartu santri</label>
        <input id="krKartu" autocomplete="off" autocapitalize="characters" placeholder="Scan atau ketik kode kartu">
        <button class="abu" onclick="bukaKamera('krKartu', krCekKartu)">📷 Scan dengan kamera</button>
        <button onclick="krCekKartu()">Lanjut</button>
      </div>
    </div>
    <div id="kr2" class="kartu hide">
      <div class="besar" id="krNama"></div>
      <div id="krRincian"></div>
      <label>Masukkan PIN</label>
      <input id="krPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      <button id="btnKrBayar" onclick="krBayar()">Bayar</button>
      <button class="abu" onclick="krKembali()">Batal</button>
    </div>
    <div id="kr3" class="kartu hide">
      <div class="besar" id="krHasil"></div>
      <div id="krDetail"></div>
      <button onclick="krTransaksiBaru()">Transaksi baru</button>
    </div>
    <div id="pesanKr" class="pesan"></div>
  </div>

  <!-- PENJUAL (lihat saja, kelola menu sendiri) -->
  <div id="penjual" class="hide">
    <div class="kartu">
      <div class="besar">Menu jualan saya</div>
      <div id="daftarMenu" style="margin-bottom:8px">Memuat...</div>
      <label id="emJudul">Tambah menu baru</label>
      <input id="emNama" autocomplete="off" maxlength="50" placeholder="Nama menu">
      <input id="emHarga" inputmode="numeric" autocomplete="off" placeholder="Harga (Rp)" style="margin-top:6px">
      <button id="btnMenu" onclick="simpanMenu()">Tambah menu</button>
      <button id="btnBatalMenu" class="abu hide" onclick="batalEditMenu()">Batal ubah</button>
      <div id="pesanMenu" class="pesan"></div>
    </div>
    <div class="kartu">
      <div class="besar">Penjualan saya</div>
      <button class="abu" onclick="muatRiwayatPenjual()">Lihat riwayat penjualan</button>
      <div id="riwayatPenjual" style="margin-top:10px;overflow-x:auto"></div>
    </div>
    <div class="kartu">
      <div id="rkTeks">Memuat ringkasan...</div>
    </div>
  </div>

  <!-- BENDAHARA -->
  <div id="bendahara" class="hide">
    <div id="b1" class="kartu">
      <label>Kartu santri</label>
      <input id="bId" autocomplete="off" autocapitalize="characters" placeholder="Scan atau ketik kode kartu">
      <button class="abu" onclick="bukaKamera('bId', bCek)">📷 Scan dengan kamera</button>
      <button onclick="bCek()">Cari</button>
    </div>
    <div id="b2" class="kartu hide">
      <div class="besar" id="bNama"></div>
      <div id="bSaldo"></div>
      <label>Nominal top-up (Rp)</label>
      <input id="bNominal" inputmode="numeric" autocomplete="off">
      <label>Catatan (misal: tunai atau transfer BCA)</label>
      <input id="bCatatan" autocomplete="off" maxlength="100">
      <button id="btnTopup" onclick="bSimpan()">Simpan top-up</button>
      <button class="abu" onclick="bendaharaReset()">Batal</button>
    </div>
    <div id="pesanBend" class="pesan"></div>

    <div class="kartu">
      <div class="besar">Riwayat per kelas</div>
      <label>Kelas</label>
      <select id="rkKelas"></select>
      <label>Periode</label>
      <select id="rkPeriode">
        <option value="hari_ini">Hari ini</option>
        <option value="tujuh_hari">7 hari terakhir</option>
        <option value="bulan_ini" selected>Bulan ini</option>
        <option value="semua">Semua</option>
      </select>
      <button onclick="tampilKelas()">Tampilkan</button>
      <div id="pesanKelas" class="pesan"></div>
      <div id="ringkasKelas" style="margin-top:10px;overflow-x:auto"></div>
      <div id="rincianKelas" style="margin-top:10px;overflow-x:auto"></div>
    </div>

    <div class="kartu">
      <div class="besar">Pencairan dana penjual</div>
      <label>Pilih penjual</label>
      <select id="pPenjual" onchange="pPilih()"></select>
      <div id="pInfo" style="margin-top:8px"></div>
      <label>Nominal yang dicairkan (Rp)</label>
      <input id="pNominal" inputmode="numeric" autocomplete="off">
      <label>Catatan (misal: transfer BRI atau tunai)</label>
      <input id="pCatatan" autocomplete="off" maxlength="100">
      <button id="btnCair" onclick="pCairkan()">Cairkan</button>
      <div id="pesanCair" class="pesan"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxg60hlqOu_xPAydyV_AgHthFNJl5YcGDYGfr2cBzwGPml9xG7tIYB2N26r6u5g0Q2cNQ/exec';

// ----- Variabel bersama -----
let token = null, sesi = null, kartuAktif = null, pemindai = null;
let daftarPenjual = [];
let kelasTerpilih = '', periodeTerpilih = 'bulan_ini';
let menuLama = null; // nama menu yang sedang diubah (null = mode tambah)
let krPenjual = [], krMenu = {}, krItems = [], krKartuAktif = null, krTimer = null;

// ----- Fungsi umum -----
function $(id) { return document.getElementById(id); }
function rupiah(n) { return 'Rp' + Number(n).toLocaleString('id-ID'); }
function angka(teks) { return parseInt(String(teks).replace(/\D/g, ''), 10) || 0; }
function lihat(id, ya) { $(id).classList.toggle('hide', !ya); }
function sembunyi(id) { $(id).style.display = 'none'; }
function tampil(id, teks, jenis) {
  const e = $(id);
  e.textContent = teks;
  e.className = 'pesan ' + jenis;
  e.style.display = 'block';
}

// Memanggil server (Apps Script)
async function panggil(fn, ...args) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args })
  });
  return await res.json();
}

function tabelDari(kepala, baris) {
  const tabel = document.createElement('table');
  tabel.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px';
  const k = tabel.insertRow();
  kepala.forEach(function (t) {
    const th = document.createElement('th');
    th.textContent = t;
    th.style.cssText = 'text-align:left;border-bottom:2px solid #b8c5bd;padding:4px';
    k.appendChild(th);
  });
  baris.forEach(function (isi) {
    const b = tabel.insertRow();
    isi.forEach(function (t) {
      const td = b.insertCell();
      td.textContent = t;
      td.style.cssText = 'border-bottom:1px solid #e2e8e4;padding:4px';
    });
  });
  return tabel;
}

// ----- Sesi dan login -----
function sesiHabis(r) {
  if (r && !r.ok && r.pesan && r.pesan.indexOf('Sesi berakhir') === 0) {
    keluarLokal('Sesi berakhir, silakan masuk lagi');
    return true;
  }
  return false;
}

function keluarLokal(pesan) {
  token = null; sesi = null; kartuAktif = null;
  hapusSesi();
  tutupKamera();
  clearTimeout(krTimer);
  krItems = []; krKartuAktif = null;
  lihat('keranjang', false); lihat('penjual', false); lihat('bendahara', false);
  lihat('bar', false); lihat('login', true);
  if (pesan) tampil('pesanLogin', pesan, 'err'); else sembunyi('pesanLogin');
  $('user').focus();
}

async function keluarKlik() {
  const t = token;
  keluarLokal('');
  try { await panggil('keluar', t); } catch (e) {}
}

function simpanSesi() {
  try {
    sessionStorage.setItem('saqupay_sesi', JSON.stringify({ token: token, sesi: sesi }));
  } catch (e) {}
}
function hapusSesi() {
  try { sessionStorage.removeItem('saqupay_sesi'); } catch (e) {}
}
function pulihkanSesi() {
  try {
    const j = sessionStorage.getItem('saqupay_sesi');
    if (!j) return false;
    const d = JSON.parse(j);
    if (!d || !d.token || !d.sesi) return false;
    token = d.token;
    sesi = d.sesi;
    tampilkanHalaman();
    return true;
  } catch (e) {
    return false;
  }
}

async function masukKlik() {
  $('btnMasuk').disabled = true;
  try {
    const r = await panggil('masuk', $('user').value, $('pass').value);
    $('pass').value = '';
    if (!r.ok) { tampil('pesanLogin', r.pesan, 'err'); return; }
    token = r.token; sesi = r;
    simpanSesi();
    sembunyi('pesanLogin');
    tampilkanHalaman();
  } catch (e) {
    tampil('pesanLogin', 'Gagal terhubung ke server (' + e.message + ')', 'err');
  } finally {
    $('btnMasuk').disabled = false;
  }
}

function tampilkanHalaman() {
  if (sesi.peran !== 'kasir' && sesi.peran !== 'bendahara' && sesi.peran !== 'penjual') {
    const p = sesi.peran, t = token;
    keluarLokal('Peran ' + p + ' belum memiliki halaman');
    panggil('keluar', t).catch(function () {});
    return;
  }
  lihat('login', false); lihat('bar', true);
  $('info').textContent = sesi.username + ' (' + sesi.peran +
    (sesi.id_penjual ? ' - ' + sesi.id_penjual : '') + ')';
  lihat('keranjang', sesi.peran === 'kasir');
  lihat('penjual', sesi.peran === 'penjual');
  lihat('bendahara', sesi.peran === 'bendahara');
  sembunyi('pesanBend'); sembunyi('pesanCair');
  if (sesi.peran === 'kasir') {
    krTransaksiBaru(); krMuat();
  } else if (sesi.peran === 'penjual') {
    muatRingkasPenjual(); muatMenu();
  } else {
    bendaharaReset(); muatPenjual(); muatKelas();
  }
}

// ----- Kamera (scan langsung) -----
async function bukaKamera(idInput, sesudah) {
  await tutupKamera();
  lihat('kamera', true);
  sembunyi('pesanKamera');
  $('kamera').scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (typeof Html5Qrcode === 'undefined') {
    tampil('pesanKamera', 'Pembaca kamera gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.', 'err');
    return;
  }
  pemindai = new Html5Qrcode('reader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.CODE_128],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  });
  let sudahTerbaca = false;
  try {
    await pemindai.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: function (w, h) { const s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; } },
      function (teks) {
        if (sudahTerbaca) return;
        sudahTerbaca = true;
        if (navigator.vibrate) navigator.vibrate(100);
        $(idInput).value = String(teks).trim().toUpperCase();
        tutupKamera().then(sesudah);
      },
      function () {}
    );
  } catch (e) {
    tampil('pesanKamera', 'Kamera tidak dapat dibuka (' + String(e) +
      '). Izinkan kamera untuk situs ini di pengaturan browser, atau ketik kode kartu manual.', 'err');
  }
}

async function tutupKamera() {
  if (pemindai) {
    try { await pemindai.stop(); } catch (e) {}
    try { pemindai.clear(); } catch (e) {}
    pemindai = null;
  }
  lihat('kamera', false);
}

// ----- Kasir bersama: keranjang beberapa penjual -----
function krNamaPenjual(id) {
  const p = krPenjual.filter(function (x) { return x.id === id; })[0];
  return p ? p.nama : id;
}

async function krMuat() {
  try {
    const r = await panggil('apiDaftarMenuSemua', token);
    if (sesiHabis(r)) return;
    if (!r.ok) { tampil('pesanKr', r.pesan, 'err'); return; }
    krPenjual = r.penjual;
    krMenu = r.menu;
    const pilih = $('krPenjual');
    const terpilih = pilih.value;
    pilih.innerHTML = '';
    krPenjual.forEach(function (p) {
      const o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.nama;
      pilih.appendChild(o);
    });
    if (terpilih) pilih.value = terpilih;
    krGantiPenjual();
  } catch (e) {
    tampil('pesanKr', 'Gagal memuat daftar menu', 'err');
  }
}

function krGantiPenjual() {
  const id = $('krPenjual').value;
  const daftar = krMenu[id] || [];
  const kotak = $('krMenu');
  kotak.innerHTML = '';
  if (daftar.length === 0) {
    kotak.textContent = 'Penjual ini belum punya menu. Ketik barang di bawah.';
    return;
  }
  daftar.forEach(function (x) {
    const b = document.createElement('button');
    b.textContent = x.nama + ' (' + rupiah(x.harga) + ')';
    b.style.cssText = 'flex:1 1 45%;width:auto;margin:0;padding:10px;font-size:15px;';
    b.onclick = function () { krTambah(id, x.nama, x.harga); };
    kotak.appendChild(b);
  });
}

function krTambah(id, nama, harga) {
  if (krItems.length >= 30) {
    tampil('pesanKr', 'Keranjang penuh (maksimal 30 barang)', 'err');
    return;
  }
  krItems.push({ id_penjual: id, nama: nama, harga: harga });
  sembunyi('pesanKr');
  krTampil();
}

function krTambahManual() {
  const id = $('krPenjual').value;
  const nama = $('krNamaManual').value.trim();
  const harga = angka($('krHargaManual').value);
  if (!id) { tampil('pesanKr', 'Pilih penjual dulu', 'err'); return; }
  if (!nama) { tampil('pesanKr', 'Isi nama barang', 'err'); return; }
  if (harga <= 0) { tampil('pesanKr', 'Isi harga barang', 'err'); return; }
  krTambah(id, nama, harga);
  $('krNamaManual').value = '';
  $('krHargaManual').value = '';
}

function krTampil() {
  const kotak = $('krIsi');
  kotak.innerHTML = '';
  if (krItems.length === 0) {
    kotak.textContent = 'Keranjang kosong';
    $('krTotal').textContent = '';
    return;
  }
  let total = 0;
  krItems.forEach(function (x, i) {
    total += x.harga;
    const baris = document.createElement('div');
    baris.style.cssText = 'display:flex;align-items:center;gap:6px;border-bottom:1px solid #e2e8e4;padding:6px 0';
    const teks = document.createElement('div');
    teks.style.cssText = 'flex:1';
    teks.textContent = krNamaPenjual(x.id_penjual) + ': ' + x.nama + ' (' + rupiah(x.harga) + ')';
    const hapus = document.createElement('button');
    hapus.textContent = 'Hapus';
    hapus.style.cssText = 'width:auto;margin:0;padding:6px 10px;font-size:13px;background:#a33a2d';
    hapus.onclick = function () { krItems.splice(i, 1); krTampil(); };
    baris.appendChild(teks);
    baris.appendChild(hapus);
    kotak.appendChild(baris);
  });
  $('krTotal').textContent = 'Total: ' + rupiah(total);
}

function krKosongkan() {
  krItems = [];
  krTampil();
}

async function krCekKartu() {
  const id = $('krKartu').value.trim();
  if (krItems.length === 0) { tampil('pesanKr', 'Keranjang masih kosong', 'err'); return; }
  if (!id) { tampil('pesanKr', 'Scan kartu dulu', 'err'); $('krKartu').focus(); return; }
  try {
    const r = await panggil('apiCekSantri', token, id);
    if (sesiHabis(r)) return;
    if (!r.ok) { $('krKartu').value = ''; tampil('pesanKr', r.pesan, 'err'); return; }
    krKartuAktif = { id: r.id_kartu };
    sembunyi('pesanKr');
    $('krNama').textContent = r.nama + ' (kelas ' + r.kelas + ')';
    const per = {}, urut = [];
    krItems.forEach(function (x) {
      if (!per[x.id_penjual]) { per[x.id_penjual] = { subtotal: 0, nama: [] }; urut.push(x.id_penjual); }
      per[x.id_penjual].subtotal += x.harga;
      per[x.id_penjual].nama.push(x.nama);
    });
    const kotak = $('krRincian');
    kotak.innerHTML = '';
    let total = 0;
    urut.forEach(function (idP) {
      total += per[idP].subtotal;
      const d = document.createElement('div');
      d.textContent = krNamaPenjual(idP) + ': ' + per[idP].nama.join(', ') + ' = ' + rupiah(per[idP].subtotal);
      kotak.appendChild(d);
    });
    const t = document.createElement('div');
    t.className = 'besar';
    t.style.marginTop = '6px';
    t.textContent = 'Total bayar: ' + rupiah(total);
    kotak.appendChild(t);
    lihat('kr1', false); lihat('kr2', true);
    $('krPin').focus();
  } catch (e) {
    tampil('pesanKr', 'Koneksi bermasalah, coba lagi', 'err');
  }
}

async function krBayar() {
  if (!krKartuAktif || krItems.length === 0) return;
  const pin = $('krPin').value;
  if (!/^\d{6,8}$/.test(pin)) {
    tampil('pesanKr', 'PIN harus 6 sampai 8 angka', 'err');
    $('krPin').focus();
    return;
  }
  $('btnKrBayar').disabled = true;
  try {
    const r = await panggil('apiBayarKeranjang', token, krKartuAktif.id, pin, krItems);
    $('krPin').value = '';
    if (sesiHabis(r)) return;
    if (r.ok) {
      lihat('kr2', false); lihat('kr3', true);
      sembunyi('pesanKr');
      $('krHasil').textContent = '✔ Pembayaran berhasil';
      $('krDetail').textContent = r.nama + ' | Dibayar ' + rupiah(r.total) +
        ' | Sisa saldo ' + rupiah(r.saldo_sesudah);
      krItems = [];
      krTampil();
      krTimer = setTimeout(krTransaksiBaru, 10000);
    } else if (r.pesan.indexOf('PIN salah') === 0 && r.pesan.indexOf('dikunci') === -1) {
      tampil('pesanKr', r.pesan, 'err');
      $('krPin').focus();
    } else {
      krKembali();
      tampil('pesanKr', r.pesan, 'err');
    }
  } catch (e) {
    tampil('pesanKr', 'Koneksi bermasalah. Cek dulu riwayat transaksi sebelum mengulang.', 'err');
  } finally {
    $('btnKrBayar').disabled = false;
  }
}

function krKembali() {
  krKartuAktif = null;
  $('krKartu').value = '';
  $('krPin').value = '';
  lihat('kr1', true); lihat('kr2', false); lihat('kr3', false);
}

function krTransaksiBaru() {
  clearTimeout(krTimer);
  krItems = [];
  krTampil();
  krKembali();
  sembunyi('pesanKr');
}

// ----- Penjual: ringkasan, riwayat, dan menu sendiri -----
async function muatRingkasPenjual() {
  try {
    const r = await panggil('apiRingkasanKasir', token);
    if (sesiHabis(r)) return;
    if (!r.ok) { $('rkTeks').textContent = r.pesan; return; }
    $('rkTeks').textContent = 'Hari ini: ' + r.jumlah_hari_ini + ' transaksi, ' +
      rupiah(r.hari_ini) + ' | Belum dicairkan: ' + rupiah(r.belum_cair);
  } catch (e) {
    $('rkTeks').textContent = 'Ringkasan tidak tersedia';
  }
}

async function muatRiwayatPenjual() {
  const kotak = $('riwayatPenjual');
  kotak.textContent = 'Memuat riwayat...';
  try {
    const r = await panggil('apiRiwayatPenjual', token);
    if (sesiHabis(r)) return;
    if (!r.ok) { kotak.textContent = r.pesan; return; }
    if (r.transaksi.length === 0) { kotak.textContent = 'Belum ada transaksi.'; return; }
    kotak.innerHTML = '';
    kotak.appendChild(tabelDari(['Waktu', 'Jenis', 'Santri', 'Barang', 'Nominal'],
      r.transaksi.map(function (x) {
        return [x.waktu, x.jenis === 'pencairan' ? 'pencairan diterima' : 'penjualan', x.santri, x.barang, rupiah(x.nominal)];
      })));
  } catch (e) {
    kotak.textContent = 'Koneksi bermasalah, coba lagi';
  }
}

async function muatMenu() {
  try {
    const r = await panggil('apiDaftarBarang', token);
    if (sesiHabis(r)) return;
    tampilMenu(r.ok ? r.daftar : []);
  } catch (e) {}
}

function tampilMenu(daftar) {
  const kotak = $('daftarMenu');
  kotak.innerHTML = '';
  if (!daftar || daftar.length === 0) {
    kotak.textContent = 'Belum ada menu. Tambahkan di bawah.';
    return;
  }
  daftar.forEach(function (x) {
    const baris = document.createElement('div');
    baris.style.cssText = 'display:flex;align-items:center;gap:6px;border-bottom:1px solid #e2e8e4;padding:6px 0';
    const teks = document.createElement('div');
    teks.style.cssText = 'flex:1';
    teks.textContent = x.nama + ' (' + rupiah(x.harga) + ')';
    const ubah = document.createElement('button');
    ubah.textContent = 'Ubah';
    ubah.className = 'abu';
    ubah.style.cssText = 'width:auto;margin:0;padding:6px 10px;font-size:13px';
    ubah.onclick = function () { mulaiUbahMenu(x.nama, x.harga); };
    const hapus = document.createElement('button');
    hapus.textContent = 'Hapus';
    hapus.style.cssText = 'width:auto;margin:0;padding:6px 10px;font-size:13px;background:#a33a2d';
    hapus.onclick = function () { hapusMenu(x.nama); };
    baris.appendChild(teks);
    baris.appendChild(ubah);
    baris.appendChild(hapus);
    kotak.appendChild(baris);
  });
}

function mulaiUbahMenu(nama, harga) {
  menuLama = nama;
  $('emNama').value = nama;
  $('emHarga').value = harga;
  $('emJudul').textContent = 'Ubah menu: ' + nama;
  $('btnMenu').textContent = 'Simpan perubahan';
  lihat('btnBatalMenu', true);
  sembunyi('pesanMenu');
  $('emNama').focus();
}

function batalEditMenu() {
  menuLama = null;
  $('emNama').value = '';
  $('emHarga').value = '';
  $('emJudul').textContent = 'Tambah menu baru';
  $('btnMenu').textContent = 'Tambah menu';
  lihat('btnBatalMenu', false);
}

async function simpanMenu() {
  const nama = $('emNama').value.trim();
  const harga = angka($('emHarga').value);
  if (!nama) { tampil('pesanMenu', 'Isi nama menu', 'err'); return; }
  if (harga <= 0) { tampil('pesanMenu', 'Isi harga menu', 'err'); return; }
  $('btnMenu').disabled = true;
  try {
    const r = menuLama === null
      ? await panggil('apiTambahMenu', token, nama, harga)
      : await panggil('apiUbahMenu', token, menuLama, nama, harga);
    if (sesiHabis(r)) return;
    if (r.ok) {
      const diubah = menuLama !== null;
      batalEditMenu();
      tampil('pesanMenu', diubah ? '✔ Menu diperbarui' : '✔ Menu ditambahkan', 'ok');
      muatMenu();
    } else {
      tampil('pesanMenu', r.pesan, 'err');
    }
  } catch (e) {
    tampil('pesanMenu', 'Koneksi bermasalah, coba lagi', 'err');
  } finally {
    $('btnMenu').disabled = false;
  }
}

async function hapusMenu(nama) {
  if (!confirm('Hapus menu "' + nama + '" secara permanen?')) return;
  try {
    const r = await panggil('apiHapusMenu', token, nama);
    if (sesiHabis(r)) return;
    if (r.ok) {
      if (menuLama === nama) batalEditMenu();
      tampil('pesanMenu', '✔ Menu dihapus', 'ok');
      muatMenu();
    } else {
      tampil('pesanMenu', r.pesan, 'err');
    }
  } catch (e) {
    tampil('pesanMenu', 'Koneksi bermasalah, coba lagi', 'err');
  }
}

// ----- Bendahara: top-up -----
function bendaharaReset() {
  kartuAktif = null;
  $('bId').value = ''; $('bNominal').value = ''; $('bCatatan').value = '';
  lihat('b1', true); lihat('b2', false);
  $('bId').focus();
}

async function bCek() {
  const id = $('bId').value.trim();
  if (!id) return;
  try {
    const r = await panggil('apiCekSantri', token, id);
    if (sesiHabis(r)) return;
    if (!r.ok) {
      tampil('pesanBend', r.pesan, 'err');
      $('bId').value = ''; $('bId').focus();
      return;
    }
    kartuAktif = { id: r.id_kartu };
    sembunyi('pesanBend');
    $('bNama').textContent = r.nama + ' (kelas ' + r.kelas + ')';
    $('bSaldo').textContent = 'Saldo saat ini: ' + rupiah(r.saldo);
    lihat('b1', false); lihat('b2', true);
    $('bNominal').focus();
  } catch (e) {
    tampil('pesanBend', 'Koneksi bermasalah, coba lagi', 'err');
  }
}

async function bSimpan() {
  const nominal = angka($('bNominal').value);
  if (!kartuAktif || nominal <= 0) { tampil('pesanBend', 'Isi nominal top-up', 'err'); return; }
  $('btnTopup').disabled = true;
  try {
    const r = await panggil('apiTopup', token, kartuAktif.id, nominal, $('bCatatan').value);
    if (sesiHabis(r)) return;
    if (r.ok) {
      bendaharaReset();
      tampil('pesanBend', '✔ Top-up berhasil: ' + r.nama + ' +' + rupiah(r.nominal) +
        ' | Saldo baru ' + rupiah(r.saldo_sesudah), 'ok');
    } else {
      tampil('pesanBend', r.pesan, 'err');
    }
  } catch (e) {
    tampil('pesanBend', 'Koneksi bermasalah. Cek dulu riwayat transaksi sebelum mengulang.', 'err');
  } finally {
    $('btnTopup').disabled = false;
  }
}

// ----- Bendahara: pencairan dana penjual -----
async function muatPenjual() {
  try {
    const r = await panggil('apiRingkasanPenjual', token);
    if (sesiHabis(r)) return;
    if (!r.ok) { tampil('pesanCair', r.pesan, 'err'); return; }
    daftarPenjual = r.daftar;
    const pilih = $('pPenjual');
    const terpilih = pilih.value;
    pilih.innerHTML = '';
    daftarPenjual.forEach(function (p) {
      const o = document.createElement('option');
      o.value = p.id_penjual;
      o.textContent = p.nama + ' (' + p.id_penjual + ')';
      pilih.appendChild(o);
    });
    if (terpilih) pilih.value = terpilih;
    pPilih();
  } catch (e) {
    tampil('pesanCair', 'Gagal memuat data penjual', 'err');
  }
}

function pPilih() {
  const p = daftarPenjual.filter(function (x) { return x.id_penjual === $('pPenjual').value; })[0];
  if (!p) { $('pInfo').textContent = ''; return; }
  $('pInfo').textContent = 'Total penjualan ' + rupiah(p.penjualan) +
    ' | Sudah dicairkan ' + rupiah(p.pencairan) +
    ' | Belum dicairkan ' + rupiah(p.belum_cair);
  $('pNominal').value = p.belum_cair > 0 ? p.belum_cair : '';
}

async function pCairkan() {
  const id = $('pPenjual').value;
  const nominal = angka($('pNominal').value);
  if (!id || nominal <= 0) { tampil('pesanCair', 'Pilih penjual dan isi nominal', 'err'); return; }
  $('btnCair').disabled = true;
  try {
    const r = await panggil('apiPencairan', token, id, nominal, $('pCatatan').value);
    if (sesiHabis(r)) return;
    if (r.ok) {
      $('pCatatan').value = '';
      await muatPenjual();
      tampil('pesanCair', '✔ Pencairan ' + rupiah(r.nominal) + ' untuk ' + r.nama +
        ' tercatat. Sisa belum dicairkan ' + rupiah(r.sisa_belum_cair), 'ok');
    } else {
      tampil('pesanCair', r.pesan, 'err');
    }
  } catch (e) {
    tampil('pesanCair', 'Koneksi bermasalah. Cek dulu riwayat transaksi sebelum mengulang.', 'err');
  } finally {
    $('btnCair').disabled = false;
  }
}

// ----- Bendahara: riwayat per kelas -----
async function muatKelas() {
  try {
    const r = await panggil('apiDaftarKelas', token);
    if (sesiHabis(r)) return;
    const pilih = $('rkKelas');
    pilih.innerHTML = '';
    if (!r.ok || r.daftar.length === 0) {
      const o = document.createElement('option');
      o.value = '';
      o.textContent = '(belum ada data kelas)';
      pilih.appendChild(o);
      return;
    }
    r.daftar.forEach(function (k) {
      const o = document.createElement('option');
      o.value = k;
      o.textContent = 'Kelas ' + k;
      pilih.appendChild(o);
    });
  } catch (e) {}
}

async function tampilKelas() {
  const kelas = $('rkKelas').value;
  const periode = $('rkPeriode').value;
  if (!kelas) { tampil('pesanKelas', 'Pilih kelas dulu', 'err'); return; }
  sembunyi('pesanKelas');
  $('rincianKelas').innerHTML = '';
  const kotak = $('ringkasKelas');
  kotak.textContent = 'Memuat ringkasan...';
  try {
    const r = await panggil('apiRingkasanKelas', token, kelas, periode);
    if (sesiHabis(r)) return;
    if (!r.ok) { kotak.textContent = ''; tampil('pesanKelas', r.pesan, 'err'); return; }
    kelasTerpilih = kelas;
    periodeTerpilih = periode;
    if (r.daftar.length === 0) { kotak.textContent = 'Tidak ada santri di kelas ini.'; return; }
    kotak.innerHTML = '';
    let tTopup = 0, tBelanja = 0, tSaldo = 0, tJumlah = 0;
    const tabel = document.createElement('table');
    tabel.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px';
    const kepala = tabel.insertRow();
    ['Nama', 'Top-up', 'Belanja', 'Saldo', 'Trx', ''].forEach(function (t) {
      const th = document.createElement('th');
      th.textContent = t;
      th.style.cssText = 'text-align:left;border-bottom:2px solid #b8c5bd;padding:4px';
      kepala.appendChild(th);
    });
    r.daftar.forEach(function (s) {
      tTopup += s.topup; tBelanja += s.belanja; tSaldo += s.saldo; tJumlah += s.jumlah;
      const b = tabel.insertRow();
      [s.nama, rupiah(s.topup), rupiah(s.belanja), rupiah(s.saldo), String(s.jumlah)].forEach(function (t) {
        const td = b.insertCell();
        td.textContent = t;
        td.style.cssText = 'border-bottom:1px solid #e2e8e4;padding:4px';
      });
      const tdAksi = b.insertCell();
      tdAksi.style.cssText = 'border-bottom:1px solid #e2e8e4;padding:4px';
      const tombol = document.createElement('button');
      tombol.textContent = 'Rincian';
      tombol.style.cssText = 'width:auto;margin:0;padding:6px 10px;font-size:13px';
      tombol.onclick = function () { bukaRincian(s.id_kartu, s.nama); };
      tdAksi.appendChild(tombol);
    });
    const total = tabel.insertRow();
    ['Total kelas', rupiah(tTopup), rupiah(tBelanja), rupiah(tSaldo), String(tJumlah), ''].forEach(function (t) {
      const td = total.insertCell();
      td.textContent = t;
      td.style.cssText = 'font-weight:bold;padding:4px';
    });
    kotak.appendChild(tabel);
    const semua = document.createElement('button');
    semua.className = 'abu';
    semua.textContent = 'Rincian seluruh kelas';
    semua.onclick = function () { bukaRincian('', ''); };
    kotak.appendChild(semua);
  } catch (e) {
    kotak.textContent = '';
    tampil('pesanKelas', 'Koneksi bermasalah, coba lagi', 'err');
  }
}

async function bukaRincian(idKartu, nama) {
  const kotak = $('rincianKelas');
  kotak.textContent = 'Memuat rincian...';
  try {
    const r = await panggil('apiRincianKelas', token, kelasTerpilih, periodeTerpilih, idKartu);
    if (sesiHabis(r)) return;
    if (!r.ok) { kotak.textContent = r.pesan; return; }
    kotak.innerHTML = '';
    const judul = document.createElement('div');
    judul.style.cssText = 'font-weight:bold;margin-bottom:6px';
    judul.textContent = (nama ? 'Rincian ' + nama : 'Rincian seluruh kelas ' + kelasTerpilih) +
      (r.terpotong ? ' (300 transaksi terbaru)' : '');
    kotak.appendChild(judul);
    if (r.daftar.length === 0) {
      kotak.appendChild(document.createTextNode('Tidak ada transaksi pada periode ini.'));
      return;
    }
    kotak.appendChild(tabelDari(['Waktu', 'Santri', 'Jenis', 'Penjual', 'Nominal', 'Saldo'],
      r.daftar.map(function (x) {
        const tanda = x.jenis === 'topup' ? '+' : '-';
        return [x.waktu, x.nama, x.jenis + (x.catatan ? ' (' + x.catatan + ')' : ''),
                x.penjual, tanda + rupiah(x.nominal), rupiah(x.saldo_sesudah)];
      })));
    kotak.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    kotak.textContent = 'Koneksi bermasalah, coba lagi';
  }
}

// ----- Tombol Enter (scanner USB otomatis menekan Enter) -----
function enter(id, fn) {
  $(id).addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); fn(); }
  });
}
enter('user', function () { $('pass').focus(); });
enter('pass', masukKlik);
enter('bId', bCek);
enter('bNominal', function () { $('bCatatan').focus(); });
enter('bCatatan', bSimpan);
enter('krKartu', krCekKartu);
enter('krPin', krBayar);
enter('krNamaManual', function () { $('krHargaManual').focus(); });
enter('krHargaManual', krTambahManual);

window.onload = function () {
  if (!pulihkanSesi()) $('user').focus();
};
